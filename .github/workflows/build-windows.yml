name: NPT Vision Windows Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-2022

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.2.1
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64

      - name: Configure CMake
        run: >
          cmake -S . -B build
          -G "Visual Studio 17 2022"
          -A x64
          -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build application
        run: cmake --build build --config Release

      - name: Package Qt runtime
        shell: pwsh
        run: |
          $exe = "build/Release/NPTVision.exe"

          if (!(Test-Path $exe)) {
            throw "Build output not found: $exe"
          }

          windeployqt --release $exe

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          Get-ChildItem -Path "release" -File -Recurse |
            Where-Object { $_.Extension -in ".zip", ".exe" } |
            ForEach-Object {
              $hash = Get-FileHash $_.FullName -Algorithm SHA256
              "$($hash.Hash.ToLower())  $($_.Name)" |
                Out-File -FilePath "$($_.FullName).sha256" -Encoding ascii
            }

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: NPT-Vision-0.1.0-Windows-x64
          path: build/Release/
          if-no-files-found: error
